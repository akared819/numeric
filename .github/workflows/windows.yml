# SPDX-License-Identifier: GPL-3.0-or-later
name: Windows build
on: [push, pull_request]
concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            perl
            tar
            curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gsl
      - name: Identify compiler
        id: compiler
        run: echo "version=$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: epics-cache
        with:
          path: .build-windows/base-7.0.10
          key: epics-7.0.10-windows-2022-mingw64-gcc-${{ steps.compiler.outputs.version }}-core-v1
      - name: Build EPICS Base 7.0.10
        if: steps.epics-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p .build-windows
          cd .build-windows
          curl -fsSLO https://epics-controls.org/download/base/base-7.0.10.tar.gz
          tar -xzf base-7.0.10.tar.gz
          export EPICS_HOST_ARCH=windows-x64-mingw
          # numeric uses Channel Access and database support, not PVA submodules.
          make -C base-7.0.10 -j2 SUBMODULES=
      - uses: actions/cache/save@v4
        if: steps.epics-cache.outputs.cache-hit != 'true'
        with:
          path: .build-windows/base-7.0.10
          key: epics-7.0.10-windows-2022-mingw64-gcc-${{ steps.compiler.outputs.version }}-core-v1
      - name: Build and test numeric
        run: |
          set -eu
          export EPICS_HOST_ARCH=windows-x64-mingw
          export EPICS_BASE="$(cygpath -m "$PWD/.build-windows/base-7.0.10")"
          export GSL_DIR="$(cygpath -m /mingw64)"
          test "$(sh /mingw64/bin/gsl-config --version)" = 2.8
          g++ --version
          printf 'EPICS_BASE = %s\n' "$EPICS_BASE" > configure/RELEASE.local
          make -j2 GSL_DIR="$GSL_DIR"
          sh tests/windows.sh
